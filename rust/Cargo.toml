[package]
name = "nameforge-engine"
version = "0.1.0"
edition = "2021"
description = "High-throughput, deterministic text processing primitives for NameForge"
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nameforge-bench"
path = "src/bin/bench.rs"

[dependencies]
unicode-normalization = "0.1"
unicode_categories = "0.1"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
