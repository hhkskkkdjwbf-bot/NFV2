name: Rust engine

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-engine.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
