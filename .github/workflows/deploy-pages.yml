name: Deploy NameForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: nameforge-production-release
  cancel-in-progress: false

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Audit npm dependency vulnerabilities
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          node -e "const fs=require('fs'); let a; try { a=JSON.parse(fs.readFileSync('artifacts/npm-audit.json','utf8')); } catch (e) { console.error('npm audit did not return valid JSON:', e.message); process.exit(1); } const counts=a.metadata?.vulnerabilities; if (!counts) { console.error('npm audit response is missing vulnerability metadata'); process.exit(1); } console.log('npm audit:', JSON.stringify(counts)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fixAvailable=' + JSON.stringify(item.fixAvailable)); if ((counts.total ?? 0) > 0) { console.error('Dependency audit failed: vulnerabilities remain.'); process.exit(1); }"
          npm ls lighthouse puppeteer-core @sentry/node --depth=1
      - name: Type-check
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build:gh-pages
      - name: Run Playwright browser QA
        run: npm run test:browser
      - name: Run Lighthouse audit
        run: npm run audit:lighthouse
      - name: Upload QA and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-quality-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test-audit
    steps:
      - name: Close stale in-progress Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // The Pages API may return deployments from different environments.
            // Scan all pages so a legacy deployment cannot be hidden by an
            // environment filter. The SHA below is the orphan reported by GitHub.
            const orphanedSha = 'd30a74c32e62ea6a2b2e4ad1e5e67424c6316707';
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, per_page: 100
            });
            let inspected = 0;
            let closed = 0;
            for (const deployment of deployments) {
              const isPagesDeployment =
                deployment.environment === 'github-pages' ||
                deployment.sha === orphanedSha;
              if (!isPagesDeployment) continue;
              inspected += 1;
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 1
              });
              const latest = statuses.data[0];
              if (latest?.state !== 'in_progress' && latest?.state !== 'queued') continue;
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: deployment.id, state: 'inactive',
                description: 'Closed stale Pages deployment before the next NameForge release.',
                auto_inactive: false
              });
              closed += 1;
              core.info(`Closed stale Pages deployment ${deployment.id}; sha=${deployment.sha}; environment=${deployment.environment}; previous_state=${latest.state}.`);
            }
            core.info(`Inspected ${inspected} Pages deployment(s); closed ${closed} active deployment(s).`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-audit:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the published GitHub Pages site
        run: npm run audit:pages
        env:
          PAGES_BASE_URL: https://hhkskkkdjwbf-bot.github.io/NFV2/
      - name: Audit the published GitHub Pages site
        run: npm run audit:lighthouse
        env:
          LIGHTHOUSE_BASE_URL: https://hhkskkkdjwbf-bot.github.io/NFV2/
      - name: Upload live Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-live-lighthouse
          path: artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 14
