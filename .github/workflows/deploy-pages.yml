name: Deploy NameForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: nameforge-production-release
  cancel-in-progress: false

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install chromium
      - name: Audit npm dependency vulnerabilities
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          node -e "const fs=require('fs'); let a; try { a=JSON.parse(fs.readFileSync('artifacts/npm-audit.json','utf8')); } catch (e) { console.error('npm audit did not return valid JSON:', e.message); process.exit(1); } const counts=a.metadata?.vulnerabilities; if (!counts) { console.error('npm audit response is missing vulnerability metadata'); process.exit(1); } console.log('npm audit:', JSON.stringify(counts)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fixAvailable=' + JSON.stringify(item.fixAvailable)); if ((counts.total ?? 0) > 0) { console.error('Dependency audit failed: vulnerabilities remain.'); process.exit(1); }"
          npm ls lighthouse puppeteer-core @sentry/node --depth=1
      - name: Type-check
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build:gh-pages
      - name: Run Playwright browser QA
        run: npm run test:browser
      - name: Run Lighthouse audit
        run: npm run audit:lighthouse
      - name: Upload QA and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-quality-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test-audit
    steps:
      - name: Close stale in-progress Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const orphanedSha = 'd30a74c32e62ea6a2b2e4ad1e5e67424c6316707';

            // GitHub's deployment-status endpoint can intermittently return 5xx
            // responses. Retry transient failures, then skip only the affected
            // historical record instead of aborting the production deployment.
            async function withRetry(label, operation) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  const status = error.status ?? error.response?.status;
                  const retryable = !status || status >= 500 || status === 429;
                  if (!retryable || attempt === 3) throw error;
                  core.warning(`${label} failed (attempt ${attempt}/3, HTTP ${status ?? 'unknown'}); retrying.`);
                  await new Promise(resolve => setTimeout(resolve, 1500 * attempt));
                }
              }
            }

            try {
              const deployments = await withRetry('List deployments', () =>
                github.paginate(github.rest.repos.listDeployments, {
                  owner, repo, per_page: 100
                })
              );
              let inspected = 0;
              let closed = 0;
              let skipped = 0;

              for (const deployment of deployments) {
                const isPagesDeployment =
                  deployment.environment === 'github-pages' ||
                  deployment.sha === orphanedSha;
                if (!isPagesDeployment) continue;
                inspected += 1;

                let statuses;
                try {
                  statuses = await withRetry(`Read deployment ${deployment.id} statuses`, () =>
                    github.rest.repos.listDeploymentStatuses({
                      owner, repo, deployment_id: deployment.id, per_page: 1
                    })
                  );
                } catch (error) {
                  skipped += 1;
                  core.warning(`Could not inspect historical deployment ${deployment.id} after retries; skipping this record. ${error.message}`);
                  continue;
                }

                const latest = statuses.data[0];
                if (latest?.state !== 'in_progress' && latest?.state !== 'queued') continue;

                try {
                  await withRetry(`Close deployment ${deployment.id}`, () =>
                    github.rest.repos.createDeploymentStatus({
                      owner, repo, deployment_id: deployment.id, state: 'inactive',
                      description: 'Closed stale Pages deployment before the next NameForge release.',
                      auto_inactive: false
                    })
                  );
                  closed += 1;
                  core.info(`Closed stale Pages deployment ${deployment.id}; sha=${deployment.sha}; environment=${deployment.environment}; previous_state=${latest.state}.`);
                } catch (error) {
                  skipped += 1;
                  core.warning(`Could not close historical deployment ${deployment.id} after retries; continuing to the Pages deploy action. ${error.message}`);
                }
              }

              core.info(`Inspected ${inspected} Pages deployment(s); closed ${closed}; skipped ${skipped} transient API failure(s).`);
            } catch (error) {
              // Cleanup is defensive housekeeping. The authoritative deploy
              // action below must decide whether Pages can actually be updated.
              core.warning(`Could not complete stale-deployment cleanup; continuing to the Pages deploy action. ${error.message}`);
            }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-audit:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for Lighthouse
        run: npx playwright install chromium
      - name: Smoke-test the published GitHub Pages site
        run: npm run audit:pages
        env:
          PAGES_BASE_URL: https://hhkskkkdjwbf-bot.github.io/NFV2/
      - name: Audit the published GitHub Pages site
        run: npm run audit:lighthouse
        env:
          LIGHTHOUSE_BASE_URL: https://hhkskkkdjwbf-bot.github.io/NFV2/
      - name: Upload live Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nameforge-live-lighthouse
          path: artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 14
